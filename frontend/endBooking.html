<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap Link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- JQuery Link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/4f6d96e165.js"
      crossorigin="anonymous"
    ></script>

    <!-- Page Name -->
    <title>EcoDrive</title>

    <!-- Linking CSS -->
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />

    <!-- ######################################## INSERT PAGE'S CSS HERE \/ ########################################################### -->
    <!-- <link rel="stylesheet" href="./css/" /> -->
    <!-- ######################################## END OF PAGE'S CSS ########################################################### -->

    <!-- Linking JS -->
    <script src="./js/script.js" defer></script>

    <!-- ######################################## INSERT PAGE'S JS HERE \/ ########################################################### -->
    <script src="./js/endBooking.js" defer></script>
    <!-- ######################################## END OF PAGE'S JS ########################################################### -->

    <!-- Add a favicon to the tab bar -->
    <link rel="icon" type="image/x-icon" href="./img/ecoDrive-logo.png" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- Navbar -->
      <div id="navbar-container"></div>
    </header>

    <!-- Transparent Row with Small Height at the Top -->
    <div
      class="row"
      style="width: 10vw; height: 50px; background-color: transparent"
    ></div>

    <!-- Main Content Container -->
    <div class="container text-center">
      <div class="row justify-content-center">
        <div class="col-12 mt-5">
          <!-- Load customAlert.html dynamically -->
          <div id="customAlertContainer"></div>

          <!-- ######################################## INSERT PAGE'S CONTENT HERE \/ ########################################################### -->
          <!-- Page Content -->
          <h1 class="text-center mb-4">End Booking</h1>

          <!-- Display Booking Details -->
          <div class="card mb-3 text-start">
            <div class="card-body">
              <h5 class="card-title">Booking Details</h5>
              <div class="mb-3">
                <label class="form-label fw-bold">Booking ID:</label>
                <p id="bookingId" class="form-control-plaintext"></p>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Vehicle Model:</label>
                <p id="vehicleModel" class="form-control-plaintext"></p>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Location:</label>
                <p id="vehicleLocation" class="form-control-plaintext"></p>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Charge Level:</label>
                <p id="chargeLevel" class="form-control-plaintext"></p>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Cleanliness Status:</label>
                <p id="cleanlinessStatus" class="form-control-plaintext"></p>
              </div>
            </div>
          </div>

          <!-- Form for Updating Cleanliness and Charging Level -->
          <div class="card mb-3 text-start">
            <div class="card-body">
              <h5 class="card-title">Update Vehicle Details</h5>
              <form id="endBookingForm">
                <div class="mb-3">
                  <label for="newCleanlinessStatus" class="form-label"
                    >Cleanliness Status</label
                  >
                  <select id="newCleanlinessStatus" class="form-select">
                    <option value="Clean">Clean</option>
                    <option value="Needs Cleaning">Needs Cleaning</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="newChargeLevel" class="form-label"
                    >Charging Level (0-100)</label
                  >
                  <input
                    type="number"
                    id="newChargeLevel"
                    class="form-control"
                    min="0"
                    max="100"
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  End Booking
                </button>
              </form>
            </div>
          </div>
          <!-- ######################################## END OF PAGE'S CONTENT ########################################################### -->
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bd-footer">
      <div
        id="footer-container"
        class="container py-4 py-md-5 px-4 px-md-3 text-body-secondary"
      ></div>
    </footer>
  </body>
</html>
